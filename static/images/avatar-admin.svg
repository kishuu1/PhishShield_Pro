<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a4a" />
      <stop offset="100%" stop-color="#0c102c" />
    </linearGradient>
    <linearGradient id="avatarBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e7cff" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#00c9a7" />
    </linearGradient>
    <linearGradient id="adminCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166" />
      <stop offset="100%" stop-color="#f77f00" />
    </linearGradient>
    <filter id="avatarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="40" cy="40" r="37" fill="url(#avatarBg)" stroke="url(#avatarBorder)" stroke-width="2" />
  
  <!-- Outer Tech Dash Ring -->
  <circle cx="40" cy="40" r="33" fill="none" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.2" stroke-dasharray="4,3" />

  <!-- Person Body Silhouette -->
  <!-- Shoulders -->
  <path d="M 18,68 C 18,52 27,48 40,48 C 53,48 62,52 62,68 Z" fill="#202966" />
  <path d="M 22,68 C 22,55 30,51 40,51 C 50,51 58,55 58,68 Z" fill="#2d3b8c" />
  
  <!-- Tie / Tech Insignia -->
  <path d="M 37,51 L 43,51 L 41.5,63 L 40,66 L 38.5,63 Z" fill="url(#avatarBorder)" />

  <!-- Head -->
  <circle cx="40" cy="34" r="13" fill="#3c4eb3" />
  <!-- Hair / Visor Accent -->
  <path d="M 28,31 C 28,23 33,19 40,19 C 47,19 52,23 52,31 C 49,27 45,26 40,26 C 35,26 31,27 28,31 Z" fill="#1b2354" />
  
  <!-- Cyber Visor / Eyes -->
  <rect x="33" y="31" width="14" height="3" rx="1.5" fill="#00f0ff" filter="url(#avatarGlow)" />

  <!-- Small Admin Security Star / Badge at Bottom Right -->
  <circle cx="62" cy="62" r="11" fill="#0b0f2a" stroke="url(#avatarBorder)" stroke-width="1.5" />
  <path d="M 62,54 L 64.5,59.5 L 70,60 L 66,63.8 L 67,69.5 L 62,66.5 L 57,69.5 L 58,63.8 L 54,60 L 59.5,59.5 Z" 
        fill="url(#adminCrown)" />
</svg>
