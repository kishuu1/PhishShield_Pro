<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050819" />
      <stop offset="50%" stop-color="#090e29" />
      <stop offset="100%" stop-color="#040614" />
    </linearGradient>

    <linearGradient id="bannerShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e7cff" />
      <stop offset="60%" stop-color="#3854eb" />
      <stop offset="100%" stop-color="#00c9a7" />
    </linearGradient>

    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#00c9a7" />
    </linearGradient>

    <linearGradient id="badgeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4e7cff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00c9a7" stop-opacity="0.15" />
    </linearGradient>

    <!-- Drop Shadows and Glows -->
    <filter id="heroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="380" fill="url(#bgCanvas)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="80" r="180" fill="#4e7cff" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="1000" cy="280" r="220" fill="#00c9a7" opacity="0.1" filter="url(#softGlow)" />
  <circle cx="700" cy="60" r="140" fill="#00f0ff" opacity="0.08" filter="url(#softGlow)" />

  <!-- Grid Overlay -->
  <g stroke="rgba(78, 124, 255, 0.07)" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="120" y1="0" x2="120" y2="380" />
    <line x1="240" y1="0" x2="240" y2="380" />
    <line x1="360" y1="0" x2="360" y2="380" />
    <line x1="480" y1="0" x2="480" y2="380" />
    <line x1="600" y1="0" x2="600" y2="380" />
    <line x1="720" y1="0" x2="720" y2="380" />
    <line x1="840" y1="0" x2="840" y2="380" />
    <line x1="960" y1="0" x2="960" y2="380" />
    <line x1="1080" y1="0" x2="1080" y2="380" />
  </g>

  <!-- Left Hero Icon Assembly -->
  <g transform="translate(90, 85)">
    <!-- Outer Cyber Ring -->
    <circle cx="100" cy="100" r="95" fill="none" stroke="rgba(78, 124, 255, 0.3)" stroke-width="2" stroke-dasharray="10,6" />
    <circle cx="100" cy="100" r="82" fill="#0d1338" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1.5" />
    
    <!-- Giant Glowing Shield -->
    <path d="M 100,32 L 150,52 C 150,110 124,148 100,164 C 76,148 50,110 50,52 Z" 
          fill="url(#bannerShield)" filter="url(#heroGlow)" opacity="0.3" />
    <path d="M 100,36 L 146,55 C 146,108 122,143 100,158 C 78,143 54,108 54,55 Z" 
          fill="url(#bannerShield)" />
    <!-- Inner Dark Vault -->
    <path d="M 100,48 L 134,64 C 134,102 116,128 100,142 C 84,128 66,102 66,64 Z" 
          fill="#0c112e" stroke="rgba(0, 240, 255, 0.5)" stroke-width="1.8" />
    
    <!-- Lock & Nodes -->
    <rect x="86" y="90" width="28" height="22" rx="5" fill="url(#cyanNeon)" />
    <path d="M 91,90 L 91,80 C 91,75 95,71 100,71 C 105,71 109,75 109,80 L 109,90" 
          fill="none" stroke="url(#cyanNeon)" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="100" cy="100" r="3" fill="#090e29" />
    <line x1="100" y1="103" x2="100" y2="107" stroke="#090e29" stroke-width="2.5" stroke-linecap="round" />

    <!-- Satellite Node Dots -->
    <circle cx="28" cy="70" r="4" fill="#00f0ff" />
    <line x1="28" y1="70" x2="54" y2="82" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1.5" stroke-dasharray="3,3" />
    <circle cx="174" cy="130" r="4.5" fill="#00c9a7" />
    <line x1="174" y1="130" x2="142" y2="120" stroke="rgba(0, 201, 167, 0.4)" stroke-width="1.5" stroke-dasharray="3,3" />
  </g>

  <!-- Center & Right Typography & Messaging -->
  <g transform="translate(340, 95)">
    <!-- Security Platform Pill -->
    <rect x="0" y="0" width="260" height="28" rx="14" fill="url(#badgeGlow)" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1" />
    <circle cx="14" cy="14" r="4" fill="#00c9a7" />
    <text x="26" y="18.5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00f0ff" letter-spacing="1.2">
      SEC_ENG // ENTERPRISE EDITION
    </text>

    <!-- Main Title -->
    <text x="0" y="78" font-family="'Inter', -apple-system, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">
      Phish<tspan fill="#4e7cff">Shield</tspan> <tspan fill="#00f0ff">Pro</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="112" font-family="'Inter', sans-serif" font-size="17" font-weight="500" fill="#a0aec0" letter-spacing="0.2">
      Static Heuristic Phishing URL Analysis &amp; Threat Intelligence Platform
    </text>

    <!-- Feature Tag Badges -->
    <g transform="translate(0, 142)">
      <!-- Badge 1: Zero-Execution -->
      <rect x="0" y="0" width="180" height="32" rx="8" fill="#11183c" stroke="rgba(78, 124, 255, 0.3)" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#00c9a7" />
      <text x="28" y="20" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#d2dcff">Zero-Execution Parser</text>

      <!-- Badge 2: 10 Heuristic Rules -->
      <rect x="192" y="0" width="186" height="32" rx="8" fill="#11183c" stroke="rgba(78, 124, 255, 0.3)" stroke-width="1" />
      <circle cx="208" cy="16" r="4" fill="#4e7cff" />
      <text x="220" y="20" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#d2dcff">10 Explainable Rules</text>

      <!-- Badge 3: MongoDB Aggregations -->
      <rect x="390" y="0" width="190" height="32" rx="8" fill="#11183c" stroke="rgba(78, 124, 255, 0.3)" stroke-width="1" />
      <circle cx="406" cy="16" r="4" fill="#00f0ff" />
      <text x="418" y="20" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#d2dcff">MongoDB 8.3 Analytics</text>

      <!-- Badge 4: Risk Scoring 0-100 -->
      <rect x="592" y="0" width="180" height="32" rx="8" fill="#11183c" stroke="rgba(78, 124, 255, 0.3)" stroke-width="1" />
      <circle cx="608" cy="16" r="4" fill="#ffd166" />
      <text x="620" y="20" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#d2dcff">Bounded Risk 0–100</text>
    </g>
  </g>

  <!-- Subtle bottom border neon bar -->
  <line x1="0" y1="378" x2="1200" y2="378" stroke="url(#cyanNeon)" stroke-width="2" />
</svg>
