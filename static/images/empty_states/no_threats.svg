<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160">
  <defs>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e7cff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
  </defs>

  <circle cx="100" cy="80" r="65" fill="#4e7cff" opacity="0.08" />

  <!-- Database Cylinder Stack -->
  <g transform="translate(68, 38)">
    <!-- Top Cylinder -->
    <path d="M 0,16 C 0,7.16 14.33,0 32,0 C 49.67,0 64,7.16 64,16 C 64,24.84 49.67,32 32,32 C 14.33,32 0,24.84 0,16 Z" 
          fill="#1c2557" stroke="url(#dbGrad)" stroke-width="1.8" />
    
    <!-- Middle Cylinder -->
    <path d="M 0,22 L 0,44 C 0,52.84 14.33,60 32,60 C 49.67,60 64,52.84 64,44 L 64,22" 
          fill="none" stroke="url(#dbGrad)" stroke-width="1.8" />
    <path d="M 0,33 C 0,41.84 14.33,49 32,49 C 49.67,49 64,41.84 64,33" 
          fill="none" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1.2" stroke-dasharray="3,3" />

    <!-- Bottom Cylinder -->
    <path d="M 0,48 L 0,70 C 0,78.84 14.33,86 32,86 C 49.67,86 64,78.84 64,70 L 64,48" 
          fill="none" stroke="url(#dbGrad)" stroke-width="1.8" />

    <!-- Search / Indicator Magnifier over DB -->
    <circle cx="48" cy="68" r="16" fill="#0d1334" stroke="#00c9a7" stroke-width="2" />
    <line x1="59" y1="79" x2="72" y2="92" stroke="#00c9a7" stroke-width="3" stroke-linecap="round" />
    <!-- Plus symbol in magnifier -->
    <line x1="48" y1="62" x2="48" y2="74" stroke="#00c9a7" stroke-width="2" stroke-linecap="round" />
    <line x1="42" y1="68" x2="54" y2="68" stroke="#00c9a7" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>

