<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160">
  <defs>
    <linearGradient id="shieldOkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c9a7" />
      <stop offset="100%" stop-color="#05856e" />
    </linearGradient>
  </defs>

  <circle cx="100" cy="80" r="65" fill="#00c9a7" opacity="0.08" />

  <!-- Outer Shield -->
  <path d="M 100,32 L 138,48 C 138,88 118,114 100,126 C 82,114 62,88 62,48 Z" 
