        fill="none" stroke="#00c9a7" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Small floating stars -->
  <circle cx="48" cy="48" r="3" fill="#00c9a7" opacity="0.5" />
  <circle cx="152" cy="108" r="3.5" fill="#4e7cff" opacity="0.5" />
