<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e7cff" />
      <stop offset="50%" stop-color="#3a5ae8" />
      <stop offset="100%" stop-color="#00c9a7" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a46" />
      <stop offset="100%" stop-color="#0b0f2a" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#00c9a7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer ambient ring -->
  <circle cx="64" cy="64" r="60" fill="none" stroke="rgba(78, 124, 255, 0.2)" stroke-width="2" stroke-dasharray="6,4" />
  
  <!-- Outer Shield Shell -->
  <path d="M 64,12 L 106,28 C 106,72 84,104 64,116 C 44,104 22,72 22,28 Z" 
        fill="url(#shieldGrad)" filter="url(#glow)" opacity="0.4" />
  <path d="M 64,14 L 104,29 C 104,71 83,101 64,113 C 45,101 24,71 24,29 Z" 
        fill="url(#shieldGrad)" />

  <!-- Inner Dark Core -->
  <path d="M 64,22 L 96,34 C 96,68 79,93 64,103 C 49,93 32,68 32,34 Z" 
        fill="url(#coreGrad)" stroke="rgba(0, 240, 255, 0.4)" stroke-width="2" />

  <!-- Digital Circuit Lines -->
  <path d="M 64,30 L 64,52 M 48,46 L 64,52 M 80,46 L 64,52 M 64,74 L 64,94 M 50,82 L 64,74 M 78,82 L 64,74" 
        stroke="url(#cyanAccent)" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <circle cx="48" cy="46" r="2.5" fill="#00f0ff" />
  <circle cx="80" cy="46" r="2.5" fill="#00f0ff" />
  <circle cx="50" cy="82" r="2.5" fill="#00c9a7" />
  <circle cx="78" cy="82" r="2.5" fill="#00c9a7" />

  <!-- Security Padlock Center -->
  <rect x="52" y="58" width="24" height="18" rx="4" fill="url(#cyanAccent)" />
  <path d="M 56,58 L 56,51 C 56,46.5 59.5,43 64,43 C 68.5,43 72,46.5 72,51 L 72,58" 
        fill="none" stroke="url(#cyanAccent)" stroke-width="3" stroke-linecap="round" />
  <circle cx="64" cy="66" r="2.5" fill="#0b0f2a" />
  <path d="M 64,68.5 L 64,72" stroke="#0b0f2a" stroke-width="2" stroke-linecap="round" />
</svg>

