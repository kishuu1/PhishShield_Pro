<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580">
  <defs>
    <linearGradient id="previewBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e27" />
      <stop offset="100%" stop-color="#060919" />
    </linearGradient>
    <linearGradient id="sidebarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1233" />
      <stop offset="100%" stop-color="#080c22" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131842" />
      <stop offset="100%" stop-color="#0f1334" />
    </linearGradient>
    <linearGradient id="riskHighGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4757" />
      <stop offset="100%" stop-color="#d63031" />
    </linearGradient>
    <linearGradient id="chartLineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4e7cff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#4e7cff" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Main Window Frame -->
  <rect width="1000" height="580" rx="14" fill="url(#previewBg)" stroke="rgba(78, 124, 255, 0.25)" stroke-width="1.5" />

  <!-- Window Header / Browser Dots -->
  <rect width="1000" height="34" rx="14" fill="#080c20" />
  <circle cx="20" cy="17" r="4.5" fill="#ff5f56" />
  <circle cx="36" cy="17" r="4.5" fill="#ffbd2e" />
  <circle cx="52" cy="17" r="4.5" fill="#27c93f" />
  <rect x="340" y="7" width="320" height="20" rx="6" fill="#111638" />
  <text x="500" y="21" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#7888b5">https://localhost:5000/dashboard</text>

  <!-- Sidebar (Left 200px) -->
  <g transform="translate(0, 34)">
    <rect width="200" height="546" fill="url(#sidebarBg)" stroke="rgba(78, 124, 255, 0.12)" stroke-width="1" />
    
    <!-- Logo -->
    <g transform="translate(18, 18)">
      <path d="M 12,2 L 22,6 C 22,18 17,24 12,27 C 7,24 2,18 2,6 Z" fill="#4e7cff" />
      <text x="30" y="18" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#ffffff">PhishShield <tspan fill="#00f0ff">Pro</tspan></text>
    </g>

    <!-- Nav Items -->
    <g transform="translate(12, 60)">
      <!-- Dashboard (Active) -->
      <rect width="176" height="34" rx="8" fill="#4e7cff" />
      <circle cx="22" cy="17" r="4" fill="#ffffff" />
      <text x="36" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#ffffff">Dashboard</text>

      <!-- URL Scanner -->
      <g transform="translate(0, 42)">
        <text x="36" y="22" font-family="'Inter', sans-serif" font-size="12" fill="#9aa3c7">URL Scanner</text>
      </g>
      <!-- Scan History -->
      <g transform="translate(0, 80)">
        <text x="36" y="22" font-family="'Inter', sans-serif" font-size="12" fill="#9aa3c7">Scan History</text>
      </g>
      <!-- Threat Intel -->
      <g transform="translate(0, 118)">
        <text x="36" y="22" font-family="'Inter', sans-serif" font-size="12" fill="#9aa3c7">Threat Intelligence</text>
      </g>
      <!-- Security Alerts -->
      <g transform="translate(0, 156)">
        <text x="36" y="22" font-family="'Inter', sans-serif" font-size="12" fill="#9aa3c7">Security Alerts</text>
        <circle cx="160" cy="17" r="8" fill="#ff4757" />
        <text x="160" y="21" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#fff">3</text>
      </g>
      <!-- Analytics -->
      <g transform="translate(0, 194)">
        <text x="36" y="22" font-family="'Inter', sans-serif" font-size="12" fill="#9aa3c7">Analytics</text>
      </g>
      <!-- Reports -->
      <g transform="translate(0, 232)">
        <text x="36" y="22" font-family="'Inter', sans-serif" font-size="12" fill="#9aa3c7">Reports (CSV)</text>
      </g>
      <!-- User Management -->
      <g transform="translate(0, 270)">
        <text x="36" y="22" font-family="'Inter', sans-serif" font-size="12" fill="#9aa3c7">User Management</text>
      </g>
      <!-- Audit Logs -->
      <g transform="translate(0, 308)">
        <text x="36" y="22" font-family="'Inter', sans-serif" font-size="12" fill="#9aa3c7">Audit Logs</text>
      </g>
    </g>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(216, 46)">
    <!-- Top Bar with Admin Dropdown -->
    <text x="0" y="22" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#ffffff">Threat Telemetry Dashboard</text>
    <text x="0" y="38" font-family="'Inter', sans-serif" font-size="11" fill="#7888b5">Real-time Static Heuristic URL Analysis Engine</text>

    <!-- Admin Button in Top Bar (Right) -->
    <g transform="translate(620, 2)">
      <rect width="138" height="34" rx="8" fill="#141a46" stroke="rgba(78, 124, 255, 0.4)" stroke-width="1.2" />
      <!-- Admin Avatar -->
      <circle cx="20" cy="17" r="11" fill="#2d3b8c" stroke="#00f0ff" stroke-width="1.2" />
      <circle cx="20" cy="14" r="4.5" fill="#fff" />
      <path d="M 13,23 C 13,19 16,18 20,18 C 24,18 27,19 27,23 Z" fill="#fff" />
      <!-- Admin name & tag -->
      <text x="38" y="16" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ffffff">admin</text>
      <text x="38" y="27" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#00c9a7">SYSTEM_ADMIN</text>
      <polygon points="122,15 128,15 125,19" fill="#9aa3c7" />
    </g>

    <!-- 4 KPI Cards -->
    <g transform="translate(0, 52)">
      <!-- Card 1: Total Scans -->
      <g transform="translate(0, 0)">
        <rect width="180" height="76" rx="10" fill="url(#cardBg)" stroke="rgba(78, 124, 255, 0.15)" stroke-width="1" />
        <text x="16" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#9aa3c7">TOTAL SCANS</text>
        <text x="16" y="54" font-family="'Inter', sans-serif" font-size="24" font-weight="800" fill="#ffffff">1,420</text>
        <circle cx="152" cy="38" r="16" fill="rgba(78, 124, 255, 0.12)" />
        <path d="M 152,30 L 157,33 L 157,41 L 152,44 L 147,41 L 147,33 Z" fill="#4e7cff" />
      </g>

      <!-- Card 2: Safe Scans -->
      <g transform="translate(192, 0)">
        <rect width="180" height="76" rx="10" fill="url(#cardBg)" stroke="rgba(0, 201, 167, 0.2)" stroke-width="1" />
        <text x="16" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#9aa3c7">SAFE (LOW RISK)</text>
        <text x="16" y="54" font-family="'Inter', sans-serif" font-size="24" font-weight="800" fill="#00c9a7">1,085</text>
        <circle cx="152" cy="38" r="16" fill="rgba(0, 201, 167, 0.12)" />
        <path d="M 148,38 L 151,41 L 157,35" stroke="#00c9a7" stroke-width="2" fill="none" stroke-linecap="round" />
      </g>

      <!-- Card 3: Suspicious -->
      <g transform="translate(384, 0)">
        <rect width="180" height="76" rx="10" fill="url(#cardBg)" stroke="rgba(255, 193, 7, 0.2)" stroke-width="1" />
        <text x="16" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#9aa3c7">SUSPICIOUS (MED)</text>
        <text x="16" y="54" font-family="'Inter', sans-serif" font-size="24" font-weight="800" fill="#ffd166">215</text>
        <circle cx="152" cy="38" r="16" fill="rgba(255, 193, 7, 0.12)" />
        <text x="152" y="44" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#ffd166">!</text>
      </g>

      <!-- Card 4: High Risk -->
      <g transform="translate(576, 0)">
        <rect width="180" height="76" rx="10" fill="url(#cardBg)" stroke="rgba(255, 71, 87, 0.25)" stroke-width="1" />
        <text x="16" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#9aa3c7">HIGH RISK THREATS</text>
        <text x="16" y="54" font-family="'Inter', sans-serif" font-size="24" font-weight="800" fill="#ff4757">120</text>
        <circle cx="152" cy="38" r="16" fill="rgba(255, 71, 87, 0.15)" />
        <path d="M 152,30 L 159,44 L 145,44 Z" fill="#ff4757" />
      </g>
    </g>

    <!-- Interactive URL Scanner Search Bar -->
    <g transform="translate(0, 142)">
      <rect width="756" height="52" rx="10" fill="#11163e" stroke="rgba(78, 124, 255, 0.35)" stroke-width="1.2" />
      <text x="18" y="32" font-family="'Inter', sans-serif" font-size="14" fill="#4e7cff"><tspan font-weight="700">SCAN &gt;</tspan></text>
      <text x="76" y="31" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f0f4fc">http://secure-paypal-verify-login.account-update.xyz/auth</text>
      <rect x="636" y="8" width="110" height="36" rx="6" fill="#4e7cff" />
      <text x="691" y="30.5" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#fff">Analyze URL</text>
    </g>

    <!-- Analytics Charts Row -->
    <g transform="translate(0, 206)">
      <!-- Left Chart: Activity Trend -->
      <g transform="translate(0, 0)">
        <rect width="470" height="180" rx="10" fill="url(#cardBg)" stroke="rgba(78, 124, 255, 0.12)" stroke-width="1" />
        <text x="18" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#fff">Daily Scanning Telemetry</text>
        <text x="18" y="42" font-family="'Inter', sans-serif" font-size="10" fill="#7888b5">Last 7 Days Scan Volume</text>
        
        <!-- Sparkline Curve -->
        <path d="M 40,140 Q 90,80 150,110 T 260,70 T 370,120 T 430,60 L 430,150 L 40,150 Z" fill="url(#chartLineGrad)" />
        <path d="M 40,140 Q 90,80 150,110 T 260,70 T 370,120 T 430,60" fill="none" stroke="#4e7cff" stroke-width="2.5" />
        <circle cx="260" cy="70" r="4" fill="#00f0ff" stroke="#fff" stroke-width="1.5" />
        <circle cx="430" cy="60" r="4" fill="#00f0ff" stroke="#fff" stroke-width="1.5" />
      </g>

      <!-- Right Gauge: High Risk Gauge Score -->
      <g transform="translate(484, 0)">
        <rect width="272" height="180" rx="10" fill="url(#cardBg)" stroke="rgba(78, 124, 255, 0.12)" stroke-width="1" />
        <text x="18" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#fff">Live Risk Evaluation</text>
        
        <!-- Circular Risk Gauge -->
        <circle cx="136" cy="98" r="48" fill="none" stroke="#1d265e" stroke-width="10" stroke-dasharray="240" stroke-dashoffset="60" />
        <circle cx="136" cy="98" r="48" fill="none" stroke="#ff4757" stroke-width="10" stroke-dasharray="240" stroke-dashoffset="110" stroke-linecap="round" />
        
        <text x="136" y="96" text-anchor="middle" font-family="'Inter', sans-serif" font-size="28" font-weight="900" fill="#ff4757">85</text>
        <text x="136" y="112" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#ff4757">HIGH RISK</text>

        <!-- Triggered indicators pill -->
        <rect x="46" y="148" width="180" height="20" rx="4" fill="rgba(255, 71, 87, 0.15)" />
        <text x="136" y="162" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#ff6b81">3 Heuristic Rules Triggered</text>
      </g>
    </g>

    <!-- Recent Alerts Mini Table -->
    <g transform="translate(0, 398)">
      <rect width="756" height="116" rx="10" fill="url(#cardBg)" stroke="rgba(78, 124, 255, 0.12)" stroke-width="1" />
      <text x="18" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#fff">Recent Security Alerts</text>
      
      <!-- Row 1 -->
      <g transform="translate(18, 42)">
        <rect width="48" height="18" rx="4" fill="rgba(255, 71, 87, 0.2)" />
        <text x="24" y="13" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#ff4757">HIGH</text>
        <text x="60" y="13" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fff">http://192.168.1.105/admin-login.html</text>
        <text x="540" y="13" font-family="'Inter', sans-serif" font-size="10" fill="#7888b5">IP Hostname &#8226; Score: 78</text>
        <rect x="680" y="0" width="54" height="18" rx="4" fill="#202a66" />
        <text x="707" y="12.5" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#00f0ff">Review</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(18, 72)">
        <rect width="48" height="18" rx="4" fill="rgba(255, 193, 7, 0.2)" />
        <text x="24" y="13" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#ffd166">MED</text>
        <text x="60" y="13" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fff">https://bit.ly/3xY9kLq?token=a8f9c2</text>
        <text x="540" y="13" font-family="'Inter', sans-serif" font-size="10" fill="#7888b5">Shortener &#8226; Score: 45</text>
        <rect x="680" y="0" width="54" height="18" rx="4" fill="#202a66" />
        <text x="707" y="12.5" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#00f0ff">Review</text>
      </g>
    </g>
  </g>
</svg>

