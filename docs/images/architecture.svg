      <text x="12" y="38" font-family="'Inter', sans-serif" font-size="10" fill="#9aa3c7">&#8226; No HTTP Socket Connection</text>
      <text x="12" y="54" font-family="'Inter', sans-serif" font-size="10" fill="#9aa3c7">&#8226; No DNS / Malware Fetch</text>
      <text x="12" y="70" font-family="'Inter', sans-serif" font-size="10" fill="#9aa3c7">&#8226; Lexical Authority Analysis</text>
      <text x="12" y="86" font-family="'Inter', sans-serif" font-size="10" fill="#9aa3c7">&#8226; RFC 3986 Normalization</text>
    </g>

    <g transform="translate(14, 172)">
      <rect width="182" height="138" rx="8" fill="#182052" stroke="rgba(0, 201, 167, 0.2)" stroke-width="1" />
      <text x="12" y="20" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ffd166">10 EXPLAINABLE RULES</text>
      <text x="12" y="38" font-family="'Inter', sans-serif" font-size="9.5" fill="#9aa3c7">1. IP Hostname (25 pts)</text>
      <text x="12" y="52" font-family="'Inter', sans-serif" font-size="9.5" fill="#9aa3c7">2. Excessive Subdomains (15)</text>
      <text x="12" y="66" font-family="'Inter', sans-serif" font-size="9.5" fill="#9aa3c7">3. Brand Typosquatting (25)</text>
      <text x="12" y="80" font-family="'Inter', sans-serif" font-size="9.5" fill="#9aa3c7">4. High-Entropy Tokens (15)</text>
      <text x="12" y="94" font-family="'Inter', sans-serif" font-size="9.5" fill="#9aa3c7">5. @-Sign Credential Trap (20)</text>
      <text x="12" y="108" font-family="'Inter', sans-serif" font-size="9.5" fill="#9aa3c7">6. URL Shorteners (15)</text>
      <text x="12" y="122" font-family="'Inter', sans-serif" font-size="9.5" fill="#9aa3c7">7. Dangerous TLD / Insecure (10)</text>
    </g>

    <g transform="translate(14, 320)">
      <rect width="182" height="90" rx="8" fill="#182052" stroke="rgba(0, 201, 167, 0.2)" stroke-width="1" />
      <text x="12" y="20" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#fff">RISK CLASSIFIER (0-100)</text>
      <text x="12" y="38" font-family="'Inter', sans-serif" font-size="10" fill="#00c9a7">&#9632; 0–39: Low Risk (Safe)</text>
      <text x="12" y="54" font-family="'Inter', sans-serif" font-size="10" fill="#ffd166">&#9632; 40–69: Medium Risk</text>
      <text x="12" y="70" font-family="'Inter', sans-serif" font-size="10" fill="#ff4757">&#9632; 70–100: High Risk Alert</text>
    </g>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 740,315 L 775,315" stroke="#7052ff" stroke-width="2.5" stroke-dasharray="5,4" />
  <polygon points="775,310 783,315 775,320" fill="#7052ff" />

