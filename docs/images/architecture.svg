  <g transform="translate(780, 100)">
    <rect width="180" height="430" rx="12" fill="url(#cardGrad1)" stroke="rgba(112, 82, 255, 0.35)" stroke-width="1.2" />
    <rect width="180" height="36" rx="12" fill="rgba(112, 82, 255, 0.15)" />
    <text x="16" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#9d86ff">4. MONGODB 8.3</text>

    <!-- 6 Collections -->
    <g transform="translate(12, 50)">
      <rect width="156" height="52" rx="6" fill="#1a1c4e" stroke="rgba(112, 82, 255, 0.2)" stroke-width="1" />
      <text x="10" y="20" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#fff">users</text>
      <text x="10" y="38" font-family="'Inter', sans-serif" font-size="9.5" fill="#7888b5">Unique idx on username</text>
    </g>

    <g transform="translate(12, 110)">
      <rect width="156" height="52" rx="6" fill="#1a1c4e" stroke="rgba(112, 82, 255, 0.2)" stroke-width="1" />
      <text x="10" y="20" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00f0ff">scan_history</text>
      <text x="10" y="38" font-family="'Inter', sans-serif" font-size="9.5" fill="#7888b5">Idx: url, risk_level, date</text>
    </g>

    <g transform="translate(12, 170)">
      <rect width="156" height="52" rx="6" fill="#1a1c4e" stroke="rgba(112, 82, 255, 0.2)" stroke-width="1" />
      <text x="10" y="20" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00c9a7">threat_intel</text>
      <text x="10" y="38" font-family="'Inter', sans-serif" font-size="9.5" fill="#7888b5">Unique idx on indicator</text>
    </g>

    <g transform="translate(12, 230)">
      <rect width="156" height="52" rx="6" fill="#1a1c4e" stroke="rgba(112, 82, 255, 0.2)" stroke-width="1" />
      <text x="10" y="20" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ff4757">security_alerts</text>
      <text x="10" y="38" font-family="'Inter', sans-serif" font-size="9.5" fill="#7888b5">Idx: severity, status</text>
    </g>

    <g transform="translate(12, 290)">
      <rect width="156" height="52" rx="6" fill="#1a1c4e" stroke="rgba(112, 82, 255, 0.2)" stroke-width="1" />
      <text x="10" y="20" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffd166">detection_rules</text>
      <text x="10" y="38" font-family="'Inter', sans-serif" font-size="9.5" fill="#7888b5">Custom heuristic weights</text>
    </g>

    <g transform="translate(12, 350)">
      <rect width="156" height="52" rx="6" fill="#1a1c4e" stroke="rgba(112, 82, 255, 0.2)" stroke-width="1" />
      <text x="10" y="20" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#9aa3c7">audit_logs</text>
      <text x="10" y="38" font-family="'Inter', sans-serif" font-size="9.5" fill="#7888b5">Tamper-evident logs</text>
    </g>
  </g>
</svg>
