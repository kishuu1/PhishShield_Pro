<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <defs>
    <linearGradient id="schemaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d26" />
      <stop offset="100%" stop-color="#050716" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121844" />
      <stop offset="100%" stop-color="#0e1336" />
    </linearGradient>
  </defs>

  <rect width="1000" height="560" rx="14" fill="url(#schemaBg)" stroke="rgba(78, 124, 255, 0.25)" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(40, 36)">
    <text x="0" y="20" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#ffffff">
      MONGODB ARCHITECTURE // 6 COLLECTIONS &amp; COMPOUND INDEXES
    </text>
    <text x="0" y="38" font-family="'JetBrains Mono', monospace" font-size="11" fill="#7888b5">
      Database: phishshield_pro &#8226; PyMongo Driver 4.12 &#8226; Enterprise Compound B-Tree Indexes
    </text>
  </g>

  <!-- Row 1: 3 Collections -->
  <g transform="translate(40, 85)">
    <!-- 1. users -->
    <g transform="translate(0, 0)">
      <rect width="290" height="205" rx="10" fill="url(#boxGrad)" stroke="rgba(78, 124, 255, 0.25)" stroke-width="1.2" />
      <rect width="290" height="32" rx="10" fill="rgba(78, 124, 255, 0.15)" />
      <text x="14" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#4e7cff">users</text>
      
      <g transform="translate(14, 46)">
        <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fff">_id: <tspan fill="#7888b5">ObjectId</tspan></text>
        <text x="0" y="30" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fff">username: <tspan fill="#7888b5">string (unique)</tspan></text>
        <text x="0" y="46" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fff">password_hash: <tspan fill="#7888b5">string (bcrypt)</tspan></text>
        <text x="0" y="62" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fff">email: <tspan fill="#7888b5">string</tspan></text>
        <text x="0" y="78" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fff">role: <tspan fill="#7888b5">string ('admin'|'analyst')</tspan></text>
        <text x="0" y="94" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fff">created_at: <tspan fill="#7888b5">datetime</tspan></text>
        <text x="0" y="110" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fff">last_login: <tspan fill="#7888b5">datetime</tspan></text>

        <rect x="0" y="122" width="262" height="24" rx="4" fill="#0d112d" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1" />
        <text x="8" y="138" font-family="'Inter', sans-serif" font-size="9.5" fill="#00f0ff">&#128273; Index: [("username", 1)] (UNIQUE)</text>
      </g>
    </g>

    <!-- 2. scan_history -->
    <g transform="translate(315, 0)">
      <rect width="290" height="205" rx="10" fill="url(#boxGrad)" stroke="rgba(0, 201, 167, 0.25)" stroke-width="1.2" />
      <rect width="290" height="32" rx="10" fill="rgba(0, 201, 167, 0.15)" />
      <text x="14" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#00c9a7">scan_history</text>
      
      <g transform="translate(14, 46)">
        <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fff">_id: <tspan fill="#7888b5">ObjectId</tspan></text>
        <text x="0" y="30" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fff">url, normalized_url, domain</text>
        <text x="0" y="46" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fff">risk_score: <tspan fill="#7888b5">int (0–100)</tspan></text>
        <text x="0" y="62" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fff">risk_level: <tspan fill="#7888b5">'Low'|'Medium'|'High'</tspan></text>
        <text x="0" y="78" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fff">rules_triggered: <tspan fill="#7888b5">array[rule_docs]</tspan></text>
        <text x="0" y="94" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fff">scanned_by, scanned_at</text>

        <rect x="0" y="122" width="262" height="24" rx="4" fill="#0d112d" stroke="rgba(0, 201, 167, 0.3)" stroke-width="1" />
        <text x="8" y="138" font-family="'Inter', sans-serif" font-size="9.5" fill="#00c9a7">&#128273; Compound: [("scanned_at", -1), ("risk_level", 1)]</text>
      </g>
    </g>

    <!-- 3. threat_intelligence -->
    <g transform="translate(630, 0)">
      <rect width="290" height="205" rx="10" fill="url(#boxGrad)" stroke="rgba(255, 193, 7, 0.25)" stroke-width="1.2" />
      <rect width="290" height="32" rx="10" fill="rgba(255, 193, 7, 0.15)" />
      <text x="14" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ffd166">threat_intelligence</text>
      
      <g transform="translate(14, 46)">
        <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fff">_id: <tspan fill="#7888b5">ObjectId</tspan></text>
        <text x="0" y="30" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fff">indicator: <tspan fill="#7888b5">string (unique domain/IP)</tspan></text>
        <text x="0" y="46" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fff">indicator_type: <tspan fill="#7888b5">'domain'|'ip'|'url'</tspan></text>
        <text x="0" y="62" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fff">threat_type: <tspan fill="#7888b5">'phishing'|'malware'</tspan></text>
        <text x="0" y="78" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fff">severity: <tspan fill="#7888b5">'Low'|'Medium'|'High'</tspan></text>
        <text x="0" y="94" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fff">source: <tspan fill="#7888b5">'Local Analyst Curated'</tspan></text>

        <rect x="0" y="122" width="262" height="24" rx="4" fill="#0d112d" stroke="rgba(255, 193, 7, 0.3)" stroke-width="1" />
        <text x="8" y="138" font-family="'Inter', sans-serif" font-size="9.5" fill="#ffd166">&#128273; Index: [("indicator", 1)] (UNIQUE)</text>
      </g>
    </g>
  </g>

  <!-- Row 2: 3 Collections -->
  <g transform="translate(40, 310)">
    <!-- 4. security_alerts -->
    <g transform="translate(0, 0)">
      <rect width="290" height="205" rx="10" fill="url(#boxGrad)" stroke="rgba(255, 71, 87, 0.25)" stroke-width="1.2" />
      <rect width="290" height="32" rx="10" fill="rgba(255, 71, 87, 0.15)" />
      <text x="14" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ff4757">security_alerts</text>
      
      <g transform="translate(14, 46)">
        <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fff">_id: <tspan fill="#7888b5">ObjectId</tspan></text>
        <text x="0" y="30" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fff">scan_id: <tspan fill="#7888b5">ObjectId (Ref: scan_history)</tspan></text>
        <text x="0" y="46" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fff">url: <tspan fill="#7888b5">string</tspan></text>
        <text x="0" y="62" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fff">severity: <tspan fill="#7888b5">'Medium' | 'High'</tspan></text>
        <text x="0" y="78" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fff">status: <tspan fill="#7888b5">'new' | 'reviewed'</tspan></text>
        <text x="0" y="94" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fff">reviewed_by, reviewed_at</text>

        <rect x="0" y="122" width="262" height="24" rx="4" fill="#0d112d" stroke="rgba(255, 71, 87, 0.3)" stroke-width="1" />
        <text x="8" y="138" font-family="'Inter', sans-serif" font-size="9.5" fill="#ff4757">&#128273; Compound: [("status", 1), ("created_at", -1)]</text>
      </g>
    </g>

    <!-- 5. detection_rules -->
    <g transform="translate(315, 0)">
      <rect width="290" height="205" rx="10" fill="url(#boxGrad)" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.2" />
      <rect width="290" height="32" rx="10" fill="rgba(0, 240, 255, 0.15)" />
      <text x="14" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#00f0ff">detection_rules</text>
      
      <g transform="translate(14, 46)">
        <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fff">_id: <tspan fill="#7888b5">ObjectId</tspan></text>
        <text x="0" y="30" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fff">rule_id: <tspan fill="#7888b5">string (unique)</tspan></text>
        <text x="0" y="46" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fff">name: <tspan fill="#7888b5">string</tspan></text>
        <text x="0" y="62" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fff">weight: <tspan fill="#7888b5">int (0–50)</tspan></text>
        <text x="0" y="78" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fff">enabled: <tspan fill="#7888b5">boolean</tspan></text>
        <text x="0" y="94" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fff">category: <tspan fill="#7888b5">'lexical'|'authority'|'intel'</tspan></text>

        <rect x="0" y="122" width="262" height="24" rx="4" fill="#0d112d" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1" />
        <text x="8" y="138" font-family="'Inter', sans-serif" font-size="9.5" fill="#00f0ff">&#128273; Index: [("rule_id", 1)] (UNIQUE)</text>
      </g>
    </g>

    <!-- 6. audit_logs -->
    <g transform="translate(630, 0)">
      <rect width="290" height="205" rx="10" fill="url(#boxGrad)" stroke="rgba(160, 174, 192, 0.25)" stroke-width="1.2" />
      <rect width="290" height="32" rx="10" fill="rgba(160, 174, 192, 0.15)" />
      <text x="14" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#cbd5e1">audit_logs</text>
      
      <g transform="translate(14, 46)">
        <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fff">_id: <tspan fill="#7888b5">ObjectId</tspan></text>
        <text x="0" y="30" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fff">action: <tspan fill="#7888b5">'LOGIN' | 'URL_SCAN' | etc.</tspan></text>
        <text x="0" y="46" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fff">username: <tspan fill="#7888b5">string</tspan></text>
        <text x="0" y="62" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fff">ip_address: <tspan fill="#7888b5">string</tspan></text>
        <text x="0" y="78" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fff">details: <tspan fill="#7888b5">embedded object</tspan></text>
        <text x="0" y="94" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fff">timestamp: <tspan fill="#7888b5">datetime</tspan></text>

        <rect x="0" y="122" width="262" height="24" rx="4" fill="#0d112d" stroke="rgba(160, 174, 192, 0.3)" stroke-width="1" />
        <text x="8" y="138" font-family="'Inter', sans-serif" font-size="9.5" fill="#cbd5e1">&#128273; Compound: [("timestamp", -1), ("action", 1)]</text>
      </g>
    </g>
  </g>
</svg>

